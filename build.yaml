# Which firmware images GitHub Actions should build.
#
# `nice_nano//zmk` is the nice!nano v2 under ZMK's current board naming.
# If yours is a v1, use `nice_nano@1//zmk` on both lines instead.
#
# For a nice!view screen, append the adapter and panel shields:
#   shield: corne_left nice_view_adapter nice_view

include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
