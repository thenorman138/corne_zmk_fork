# 2026 Corne -- ZMK build options
#
# Everything here is optional. The keymap builds and works with this file
# empty; these are the knobs worth knowing about on a battery-powered board.

# --- Display ---------------------------------------------------------------
# Leave commented out if you are not sure what screen (if any) you have.
# Enabling it with no screen attached is harmless but wastes a little power.
#
# For an SSD1306 OLED (same panel as the wired board), this line is all you
# need -- the corne shield already declares the display.
# CONFIG_ZMK_DISPLAY=y
#
# For a nice!view e-paper panel you ALSO need to add two shields to each
# entry in build.yaml, e.g.  shield: corne_left nice_view_adapter nice_view

# --- RGB underglow ---------------------------------------------------------
# Deliberately off. On a wireless board underglow is by far the largest power
# draw -- it turns weeks of battery life into hours. Uncomment both lines if
# you want it, then restore the &rgb_ug bindings on the Sys layer.
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# --- Power -----------------------------------------------------------------
# Deep sleep is OFF by default in ZMK. Turning it on is the single biggest
# battery win. Wake is a keypress; reconnect takes about a second.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Blank the display / dim after 30 s idle (ZMK default, shown for reference).
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# --- Bluetooth -------------------------------------------------------------
# Stronger radio. Helps if the halves drop each other or the host is far away.
# Costs a little battery. Uncomment only if you see connection trouble.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
